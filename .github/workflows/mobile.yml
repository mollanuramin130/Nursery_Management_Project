name: Customer mobile checks
on:
  pull_request:
    paths:
      - 'apps/nursery_app/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: ['audit/mobile-ux-2026-10-27', 'development/v1.0.0']
    paths:
      - 'apps/nursery_app/**'
      - '.github/workflows/mobile.yml'
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nursery_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Resolved dependency lock
        run: cat pubspec.lock
      - run: flutter analyze
      - run: flutter test
        if: ${{ !cancelled() }}
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://api.nuvikoz.com/api/v1
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        with:
          name: nuvikoz-customer-debug-apk
          path: apps/nursery_app/build/app/outputs/flutter-apk/app-debug.apk
