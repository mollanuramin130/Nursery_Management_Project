openapi: 3.0.3
info:
  title: GreenLeaf Nursery API
  version: 1.0.0
  description: |
    Contract source of truth for clients. Expand per endpoint from
    docs/PROJECT_DEVELOPMENT_GUIDE.md §9.
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local
  - url: https://api.example.com/api/v1
    description: Production
tags:
  - name: App
  - name: Auth
  - name: Catalog
paths:
  /app/config:
    get:
      tags: [App]
      summary: APP-01 App config
      operationId: getAppConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /auth/register:
    post:
      tags: [Auth]
      summary: AUTH-01 Register
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '201':
          description: Created
        '409':
          description: Conflict
        '422':
          description: Validation failed
  /auth/login:
    post:
      tags: [Auth]
      summary: AUTH-02 Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device:
                  type: object
                  properties:
                    platform: { type: string, enum: [web, android, ios] }
                    device_id: { type: string }
                    push_token: { type: string }
      responses:
        '200':
          description: OK
        '401':
          description: Unauthenticated
  /auth/refresh:
    post:
      tags: [Auth]
      summary: AUTH-03 Refresh token
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: OK
        '401':
          description: Unauthenticated
  /auth/logout:
    post:
      tags: [Auth]
      summary: AUTH-04 Logout
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
                all_devices: { type: boolean }
      responses:
        '200':
          description: OK
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: AUTH-05 Forgot password
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: OK
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: AUTH-06 Reset password
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '200':
          description: OK
  /auth/me:
    get:
      tags: [Auth]
      summary: AUTH-07 Current user
      operationId: me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /home:
    get:
      tags: [Catalog]
      summary: HOME-01 Home feed
      responses:
        '200':
          description: OK
  /categories:
    get:
      tags: [Catalog]
      summary: CAT-01 List categories
      responses:
        '200':
          description: OK
  /brands:
    get:
      tags: [Catalog]
      summary: BRAND-01 List brands
      responses:
        '200':
          description: OK
  /products:
    get:
      tags: [Catalog]
      summary: PROD-01 List products
      operationId: listProducts
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: OK
  /products/{idOrSlug}:
    get:
      tags: [Catalog]
      summary: PROD-02 Product detail
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
  /plants:
    get:
      tags: [Catalog]
      summary: PLANT-01 List plants
      responses:
        '200':
          description: OK
  /plants/{idOrSlug}/care:
    get:
      tags: [Catalog]
      summary: PLANT-03 Plant care
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
  /search:
    get:
      tags: [Catalog]
      summary: SEARCH-01 Search
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: OK
  /banners:
    get:
      tags: [Catalog]
      summary: BAN-01 List banners
      responses:
        '200':
          description: OK
  /campaigns:
    get:
      tags: [Catalog]
      summary: CAMP-01 List campaigns
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message, data, errors, meta]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
        errors:
          nullable: true
        meta:
          type: object
          properties:
            request_id: { type: string }
            timestamp: { type: string, format: date-time }
            error_code: { type: string }
